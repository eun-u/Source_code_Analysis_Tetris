# 전투 밸런스 수치의 단일 소유 위치, 코드에 수치를 직접 쓰지 않고 이 파일에서 조절
# 수정 후 build.ps1 -Task Run으로 재빌드·재실행 필요, 실행 중 설정 자동 갱신 미지원
# 같은 설정을 다른 파일이나 Java 코드에서 중복 관리하지 않음
# 현재 값은 G0 기준 기존 규칙과 동일, 값 변경 시 BattleManagerTest와 BattleBalanceTest의 기대값도 함께 확인
# 형식·범위 오류나 오타 난 키가 있으면 BattleBalance가 시작 시점에 거절하므로 잘못된 수치로 전투가 진행되지 않음
# 공격 한 건 계산: 피해 = 기본 피해 * (T-Spin 배율 또는 1) + 콤보 보너스, 가비지 = 기본 가비지 + T-Spin 보너스 + 콤보 보너스
# 예: 3줄·콤보 2·T-Spin이면 피해 12*2 + 2*2 = 28, 가비지 2 + 2 + 1 = 5

# 줄 제거 기본 공격, 쉼표로 구분한 5개 항목의 순서는 0줄, 1줄, 2줄, 3줄, 4줄
# 첫 항목(0줄)은 계산에 쓰이지 않으며 반드시 0, 각 항목 범위 0~1000
# damage.lines 증가 시 상대 HP가 빨리 닳아 HP 승리가 쉬워짐
# garbage.lines 증가 시 상대 보드가 빨리 차올라 Top Out 승리가 쉬워짐
# 두 승리 방식의 비율을 맞추려면 두 값을 함께 조절
damage.lines=0,4,8,12,20
garbage.lines=0,0,1,2,4

# 콤보는 줄 제거가 연속될 때 증가, 첫 줄 제거는 콤보 0이고 연속 두 번째부터 1
# perStep은 콤보 1단계당 추가 피해, 0이면 콤보 피해 보너스 없음
# cap은 피해 보너스에 반영하는 최대 콤보 단계, 콤보 피해 보너스의 최댓값은 perStep * cap
# threshold 이상의 콤보에서 가비지 bonus 줄 추가, threshold 범위 1~1000
damage.combo.perStep=2
damage.combo.cap=5
garbage.combo.threshold=2
garbage.combo.bonus=1

# T-Spin 줄 제거 보너스, multiplier는 기본 피해에만 곱하며 1이면 보너스 없음(범위 1~10)
# bonus는 추가 가비지 줄 수
damage.tspin.multiplier=2
garbage.tspin.bonus=2

# 가비지 한 번의 최대치는 22줄, garbage.lines 최댓값 + garbage.tspin.bonus + garbage.combo.bonus가 22 이하여야 함
# 초과 시 BattleBalance가 로딩 단계에서 거절
