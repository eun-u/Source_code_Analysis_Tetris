# 모든 전투의 기본 피해·가비지 규칙을 조절하는 위치. 스토리 레벨별 추가 공격 배율은 DifficultyProfileCatalog에서 조절
# 수정 후 build.ps1 -Task Run으로 재빌드·재실행 필요, 실행 중 자동 갱신 미지원
# 같은 설정을 다른 파일이나 Java 코드에서 중복 관리하지 않음
# 값 변경 시 BattleManagerTest, BattleBalanceTest, DamageManagerTest의 기대값도 함께 확인
# 형식·범위 오류나 오타 난 키가 있으면 BattleBalance가 시작 시점에 거절하므로 잘못된 수치로 전투가 진행되지 않음
# 캐릭터 능력치(공격형 버프, 방어형 HP, 유틸형 슬롯)는 character/characters.properties에서 관리
#
# HP 피해 = round((기본 피해 + 콤보 보너스) * (1 + 공격 버프 합 - 방어 합)), 최소 0
# 가비지 줄 수 = 기본 가비지 + 콤보 보너스, 버프와 방어는 가비지에 적용되지 않음
# 퍼펙트 클리어는 기본 묶음 대체이므로 콤보와 버프·방어를 모두 무시하고 아래 고정값만 사용
# 예: 3줄 + 2콤보면 피해 12 + 4 = 16, 가비지 2 + 1 = 3

# 줄 제거 기본 공격, 쉼표로 구분한 5개 항목의 순서는 0줄, 1줄, 2줄, 3줄, 4줄
# 첫 항목(0줄)은 계산에 쓰이지 않으며 반드시 0, 각 항목 범위 0~1000
# damage.lines 증가 시 상대 HP가 빨리 닳아 HP 승리가 쉬워짐
# garbage.lines 증가 시 상대 보드가 빨리 차올라 Top Out 승리가 쉬워짐
damage.lines=0,4,8,12,20
garbage.lines=0,0,1,2,4

# 콤보 보너스, 쉼표로 구분한 5개 항목의 순서는 0콤보, 1콤보, 2콤보, 3콤보, 4콤보 이상
# 첫 번째 줄 제거가 0콤보이고 연속 두 번째가 1콤보, 줄 제거에 실패하면 콤보 초기화
# 4콤보 이상은 모두 마지막 항목을 사용, 각 항목 범위 0~1000
damage.combo=0,0,4,8,12
garbage.combo=0,0,1,2,3

# 퍼펙트 클리어 고정값, 줄 제거 직후 가비지를 올리기 전에 보드가 완전히 비었을 때 적용
# damage.perfect 범위 0~1000, garbage.perfect 범위 0~22
damage.perfect=40
garbage.perfect=8

# T-Spin은 규칙에서 제외되어 보너스를 끈 상태, multiplier는 1이면 보너스 없음(범위 1~10)
# 값을 올리면 T-Spin 줄 제거 보너스가 되살아나므로 의도한 경우에만 변경
damage.tspin.multiplier=1
garbage.tspin.bonus=0

# 가비지 한 번의 최대치는 22줄, garbage.lines 최댓값 + garbage.combo 최댓값 + garbage.tspin.bonus가 22 이하여야 함
# 초과 시 BattleBalance가 로딩 단계에서 거절
