# 캐릭터 능력치의 단일 소유 위치, 기본형(HP 100, 슬롯 3칸) 대비 각 캐릭터의 보너스만 관리
# 수정 후 build.ps1 -Task Run으로 재빌드·재실행 필요, 실행 중 자동 갱신 미지원
# 형식·범위 오류나 오타 난 키가 있으면 CharacterCatalog가 시작 시점에 거절
# 전투 피해·가비지 수치는 battle/balance.properties에서 관리
# PvP에서는 기본형만 사용 가능, 서버와 세션에서 강제 필요

# 공격형: HP 피해 공격 버프 합에 더해지는 값, 0.5면 기본 피해 +50%(범위 0~5)
attack.damageBuff=0.5
# 방어형: 최대 HP 증가 비율, 0.5면 기본 HP 100에서 150(범위 0~5)
defense.hpBuff=0.5
# 유틸형: 기본 3칸에서 추가되는 아이템 슬롯 수(범위 0~4)
utility.extraSlots=1
