# 모든 몬스터는 공통 휴리스틱 탐색과 보드 평가 경로 사용
# 몬스터 난이도 프리셋에서 일반 FIXED, 엘리트 ADAPTIVE, 보스 BOSS_PHASE 정책을 선택
# 수정 후 build.ps1 -Task Run으로 재빌드·재실행 필요, 실행 중 설정 자동 갱신 미지원
# 같은 프로필을 참조하는 모든 몬스터에 공통 적용, 개별 조절 시 profiles 목록 등록과 Stage의 aiProfile 변경
profiles=normal_default,elite_default,boss_default

# line·fourLineBonus 증가 시 줄 삭제 선호 증가
# aggregateHeight·maximumHeight·holes·bumpiness·wells의 음수 절댓값 증가 시 해당 위험 회피 증가
# 수치 변화와 실제 승률 상승의 동치 여부는 대전 평가 대상
# maxSearchStates 증가 시 탐색 범위·CPU 비용 증가, budgetMillis는 계산 시간 상한
# delayMillis 증가 시 몬스터 행동 간격 증가와 압박 감소
# 예: normal_default.delayMillis의 1700→2000 변경 시 행동 간격 증가, 1700→1400 변경 시 감소
# delayMillis 허용 범위 100~10000ms, budgetMillis 1~1000ms, maxSearchStates 1~10000개
# maxWeightDeltaRatio는 적응/보스 정책의 기준 가중치 대비 최대 조정 비율
# FIXED에서는 maxWeightDeltaRatio만 바꿔도 가중치 변화 없음
normal_default.policy=FIXED
normal_default.delayMillis=1700
normal_default.maxSearchStates=700
normal_default.budgetMillis=40
normal_default.maxWeightDeltaRatio=0.25
normal_default.line=6
normal_default.fourLineBonus=15
normal_default.aggregateHeight=-0.45
normal_default.maximumHeight=-0.8
normal_default.holes=-7
normal_default.bumpiness=-0.35
normal_default.wells=-0.25

elite_default.policy=FIXED
elite_default.delayMillis=1200
elite_default.maxSearchStates=1200
elite_default.budgetMillis=65
elite_default.maxWeightDeltaRatio=0.25
elite_default.line=12
elite_default.fourLineBonus=18
elite_default.aggregateHeight=-0.2
elite_default.maximumHeight=-0.25
elite_default.holes=-4
elite_default.bumpiness=-0.2
elite_default.wells=-0.1

boss_default.policy=FIXED
boss_default.delayMillis=950
boss_default.maxSearchStates=1800
boss_default.budgetMillis=90
boss_default.maxWeightDeltaRatio=0.25
boss_default.line=3
boss_default.fourLineBonus=48
boss_default.aggregateHeight=-0.3
boss_default.maximumHeight=-0.4
boss_default.holes=-6
boss_default.bumpiness=-0.25
boss_default.wells=-0.05
