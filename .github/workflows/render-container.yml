name: Validate Render container

on:
  push:
    branches: [dev, eunjin]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate migrations, permissions and concurrent lease/result transactions
        env:
          TETRIS_TEST_POSTGRES_DSN: postgresql://postgres:ci-local-only@127.0.0.1:5432/postgres
        run: |
          python3 -m venv /tmp/tetris-sql-tests
          /tmp/tetris-sql-tests/bin/pip install 'psycopg[binary]==3.2.10'
          /tmp/tetris-sql-tests/bin/python supabase/tests/run_postgres_tests.py
  linux-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build Docker image and run all headless suites
        run: docker build --progress=plain --tag tetris-ranked:ci .
      - name: Verify the production container entry point
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker logs tetris-smoke; docker rm -f tetris-smoke >/dev/null' EXIT
          docker run --detach --name tetris-smoke \
            --publish 127.0.0.1:10000:10000 \
            --env PORT=10000 \
            --env SUPABASE_URL=http://127.0.0.1:1 \
            --env SUPABASE_PUBLISHABLE_KEY=ci-public-placeholder \
            --env SUPABASE_SECRET_KEY=ci-secret-placeholder \
            --env RENDER_ADMIN_TOKEN=ci-admin-placeholder-at-least-24-characters \
            --env TETRIS_MAX_WS_CONNECTIONS=2 \
            --env TETRIS_MAX_PENDING_AUTH=1 \
            tetris-ranked:ci
          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --retry-all-errors --max-time 2 http://127.0.0.1:10000/healthz
          test "$(docker exec tetris-smoke id -u)" = 10001
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:10000/admin/status)" = 401
          status=$(curl --fail --silent --show-error \
            --header 'Authorization: Bearer ci-admin-placeholder-at-least-24-characters' \
            http://127.0.0.1:10000/admin/status)
          [[ "$status" == *"admission=false"* ]]
          [[ "$status" == *"unresolved=0"* ]]
          echo 'PASS Linux container health, non-root user, closed admission and protected admin'
